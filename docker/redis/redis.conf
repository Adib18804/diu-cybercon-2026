# =============================================================================
# Redis config — local development
# =============================================================================

# Security
requirepass cybercon_redis_dev
protected-mode yes

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (light — dev only)
save 60 1
appendonly no

# Logging
loglevel warning

# Network
bind 0.0.0.0
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Disable dangerous commands in dev
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "CONFIG_DEV_ONLY"
